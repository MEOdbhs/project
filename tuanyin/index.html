<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet" />
  </head>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
      padding: 0;
      font-family: "Cinzel", serif;
      font-optical-sizing: auto;
      font-weight: normal;
      font-style: normal;
    }
    .bg-img {
      width: 1500px;
      height: 1000px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .item-img {
      width: 50px;
      height: 50px;
      opacity: 0;
      transition: opacity 0.5s;
      position: absolute;
      top: 30px;
      left: 40px;
    }
    .item1 {
      top: 300px;
      left: 1235px;
    }
    .item2 {
      top: 430px;
      left: 845px;
    }
    .item3 {
      top: 594px;
      left: 640px;
    }
    .item4 {
      top: 850px;
      left: 967px;
    }
    .item5 {
      top: 788px;
      left: 1182px;
    }
    .bg-img {
      border-radius: 8px;
      overflow: hidden;
    }
    .bg-box {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background-color: #232323;
    }
  </style>
  <body>
    <div class="bg-box">
      <img class="bg-img" fetchpriority="high" decoding="async" src="./assets/fextralife_map.jpg" alt="Background" />
      <img class="item-img item1" loading="lazy" decoding="async" src="./assets/mark.png" alt="" onload="this.style.opacity=1" />
      <img class="item-img item2" loading="lazy" decoding="async" src="./assets/mark.png" alt="" onload="this.style.opacity=1" />
      <img class="item-img item3" loading="lazy" decoding="async" src="./assets/mark.png" alt="" onload="this.style.opacity=1" />
      <img class="item-img item4" loading="lazy" decoding="async" src="./assets/mark.png" alt="" onload="this.style.opacity=1" />
      <img class="item-img item5" loading="lazy" decoding="async" src="./assets/mark.png" alt="" onload="this.style.opacity=1" />
    </div>
  </body>
  <script>
    const itemImgName = ["Mountaintops of the Giants", "Altus Plateau", "Liurnia of the Lakes", "Limgrave", "Caelid"];
  </script>
</html>
