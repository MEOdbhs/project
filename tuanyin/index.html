<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
      padding: 0;
    }
    .bg-img,
    .item-img {
      width: 1500px;
      height: 1000px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 默认先隐藏区域图，避免未解码时卡顿 */
    .item-img {
      opacity: 0;
      transition: opacity 0.5s;
    }
    .bg-img {
      border-radius: 8px;
      overflow: hidden;
    }
    .bg-box {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background-color: #232323; /* 加载时给个底色 */
    }
  </style>
  <body>
    <div class="bg-box">
      <!-- 优先加载背景并启用异步解码 -->
      <img class="bg-img" fetchpriority="high" decoding="async" src="./assets/fextralife_map.jpg" alt="Background" />

      <!-- 使用 loading="lazy" 和 decoding="async" 推迟前景图的解码和加载 -->
      <img class="item-img" loading="lazy" decoding="async" src="./assets/ytgy.png" alt="Altus" onload="this.style.opacity=1" />
      <img class="item-img" loading="lazy" decoding="async" src="./assets/nmgf.png" alt="Limgrave" onload="this.style.opacity=1" />
      <img
        class="item-img"
        loading="lazy"
        decoding="async"
        src="./assets/jrgy.png"
        alt="Mountaintops"
        onload="this.style.opacity=1"
      />
      <img class="item-img" loading="lazy" decoding="async" src="./assets/hzlyny.png" alt="Liurnia" onload="this.style.opacity=1" />
      <img class="item-img" loading="lazy" decoding="async" src="./assets/gld.png" alt="Caelid" onload="this.style.opacity=1" />
    </div>
  </body>
  <script>
    const itemImgName = [
      "亚坛高原-Altus Plateau",
      "宁姆格福-Limgrave",
      "巨人山顶-Mountaintops of the Giants",
      "湖之利耶尼亚-Liurnia of the Lakes",
      "盖里德.png",
    ];
  </script>
</html>
